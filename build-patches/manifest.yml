  - name: libsensorbridge-dep-macan
    target_repo: vendor/oneplus/macan
    target_path: Android.bp
    apply_order: 11
    sha256: 0a02c5523eda8a84cc546a7a8c4972d68e17400c833d52a22fa7bda041dd40f7
    rationale: libsensorbridge.so blobs exist only under vendor/oneplus/infiniti; macan has no such blob and its soong_namespace does not import the infiniti namespace. The auto-generated shared_libs dep is stale and causes Soong bootstrap to fail.

