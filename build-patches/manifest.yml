  - name: libskia-skcms-vendor-available
    target_repo: external/skia
    target_path: Android.bp
    apply_order: 5
    sha256: 4eb171d386820d5f74f10c3944215e1bc26ca1550c17dba9611e5fc50303e4c4
    rationale: libjxl is vendor-available and statically links libskia_skcms, so skcms must expose the matching vendor/static variant.
    expected_head: 22f5edb6c1bf350d1d9d67bb429db1a5539f3c05
