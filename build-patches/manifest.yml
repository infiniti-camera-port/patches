patches:
  - name: allow-oplus-fwk-boot-jars
    target_repo: build/soong
    target_path: scripts/check_boot_jars/package_allowed_list.txt
    apply_order: 1
    sha256: cef8eea74d9fa3a1ee6898b0520c443d37ce339418dd0d3c4e51eef77fef2da3
    rationale: oplus-fwk needs the mandatory com.oplusx.* boot-jar allowlist namespace and build-proven com.coloros.deepthinker/com.itgsa.opensdk.wm packages.

  - name: restore-userdebug-variant
    target_repo: build/soong
    target_path: scripts/gen_build_prop.py
    apply_order: 2
    sha256: b21c7a9e3bcc87c91c5015b4cc477b5628576ec65f72ef0afbc30756a38cf379
    rationale: Restore userdebug build variant handling so adb root and rooted debugging can work.

  - name: device-not-debuggable-empty
    target_repo: device/oneplus/infiniti
    target_path: lineage_infiniti.mk
    apply_order: 3
    sha256: aa9d7cd73a0b339f2f5aa02cde6735ba3734085368ea28b6622e810c7c29bf85
    rationale: Clear PRODUCT_NOT_DEBUGGABLE_IN_USERDEBUG after common product inherits.

  - name: libhwy-vendor-available
    target_repo: external/google-highway
    target_path: Android.bp
    apply_order: 4
    sha256: af4d37965ca8b04fd84d41e4ec60a6a57d366efbd9a45d0563d4a6b8b5a008c0
    rationale: libjxl is vendor-available and statically links libhwy, so libhwy must expose the matching vendor/static variant.
    expected_head: 12062ba78328dac793dcec57c63865ab480f1f18
    expected_base_sha256: b15f48c4741b3d0197e3e84108aa74183e3519f6f54e6b64a646a78998aeefac
