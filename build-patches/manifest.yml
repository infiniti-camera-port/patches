    apply_order: 8
    sha256: a20cdd480453c69e1ec495001c615d87286a48f620ef294b1c3b07efc72c1e50
    rationale: Clear PRODUCT_NOT_DEBUGGABLE_IN_USERDEBUG after common product inherits so the macan userdebug build keeps ro.debuggable=1.

